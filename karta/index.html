<!doctype html>
<html lang="ru">
<meta name="robots" content="noindex, nofollow">
<title>Пути медиапартнёров</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F3F7F4; --surface: #FFFFFF; --sunken: #E8EFEA; --line: #D3DDD6; --line-2: #B9C7BE;
  --ink: #121517; --ink-2: #44524A; --ink-3: #5D6B63;
  --accent: #00732D; --accent-hover: #005820; --tint: #DAF1DC; --on-accent: #FFFFFF;
  --jade: #0E6A40;
  --lane-partner: #0E6A40; --lane-dept: #12717F; --lane-mkt: #2E5FB4; --lane-fin: #8A6208; --lane-cfo: #6B45AE; --lane-admin: #5A6663; --lane-system: #3F4FB8;
  --branch: #B4540F; --branch-bg: #FCEEDF;
  --alarm: #B3122E; --alarm-bg: #FBE7EB;
  --sys: #3F4FB8; --sys-bg: #E9ECFB;
  --shadow: 0 1px 2px rgba(18,21,23,.12), 0 6px 18px -10px rgba(18,21,23,.28);
  --font-display: "Geologica", "Segoe UI", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101412; --surface: #1B211E; --sunken: #252C28; --line: #3A453E; --line-2: #55635A;
    --ink: #F2F6F3; --ink-2: #C9D3CC; --ink-3: #A3AFA8;
    --accent: #73B28C; --accent-hover: #8FC1A3; --tint: #14301F; --on-accent: #0E1411;
    --jade: #73B28C;
    --lane-partner: #73B28C; --lane-dept: #5FB6C4; --lane-mkt: #7FA6EA; --lane-fin: #D9AE4A; --lane-cfo: #B99BE8; --lane-admin: #9AA7A3; --lane-system: #8E9CF0;
    --branch: #F2A265; --branch-bg: #3A2616;
    --alarm: #FF8296; --alarm-bg: #3F1A22;
    --sys: #9AA6F5; --sys-bg: #23274A;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101412; --surface: #1B211E; --sunken: #252C28; --line: #3A453E; --line-2: #55635A;
  --ink: #F2F6F3; --ink-2: #C9D3CC; --ink-3: #A3AFA8;
  --accent: #73B28C; --accent-hover: #8FC1A3; --tint: #14301F; --on-accent: #0E1411;
  --jade: #73B28C;
  --lane-partner: #73B28C; --lane-dept: #5FB6C4; --lane-mkt: #7FA6EA; --lane-fin: #D9AE4A; --lane-cfo: #B99BE8; --lane-admin: #9AA7A3; --lane-system: #8E9CF0;
  --branch: #F2A265; --branch-bg: #3A2616;
  --alarm: #FF8296; --alarm-bg: #3F1A22;
  --sys: #9AA6F5; --sys-bg: #23274A;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 22px -10px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink-2); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; font-weight: 600; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 20px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); max-width: 1900px; margin: 0 auto; }
.top h1 { font-size: clamp(24px, 3.2vw, 34px); line-height: 1.15; }
.top .lead { margin: 8px 0 0; max-width: 62em; font-size: 16px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 16px 0 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.legend svg { flex: none; }
.ctl { display: grid; gap: 10px; margin: 14px 0 12px; }
.ctl__row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctl__lab { font: 600 12px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); min-width: 92px; }
.chip { min-height: 36px; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1.2; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip i { font: 700 12px/1 var(--font-display); font-style: normal; opacity: .9; }
.chip--fork[aria-pressed="true"] { background: var(--branch); border-color: var(--branch); color: #fff; }
:root[data-theme="dark"] .chip--fork[aria-pressed="true"] { color: #1a1008; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip--fork[aria-pressed="true"] { color: #1a1008; } }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg .chip { border: 0; border-radius: 0; }
.seg .chip + .chip { border-left: 1px solid var(--line); }
.hint { font-size: 13px; color: var(--ink-3); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.stage.has-panel { grid-template-columns: minmax(0, 1fr) 430px; }
.vp { position: relative; height: clamp(480px, 80vh, 1000px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overscroll-behavior: contain; }
.sizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.band { position: absolute; left: 0; border-bottom: 1px solid var(--line); }
.band:nth-child(odd) { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.lanelab { position: absolute; left: 0; display: flex; flex-direction: column; justify-content: center; padding: 6px 8px 6px 12px; overflow: hidden; background: var(--surface); border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line); border-left: 5px solid var(--lc, var(--ink-3)); }
.lanelab b { font: 600 14px/1.2 var(--font-display); color: var(--ink); overflow-wrap: anywhere; }
.narrow .lanelab { padding: 4px 4px 4px 8px; }
.narrow .lanelab b { font-size: 11.5px; }
.narrow .lanelab small { font-size: 10.5px; }
.lanelab small { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.25; }
.band__empty { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 12.5px; color: var(--ink-3); max-width: 560px; line-height: 1.35; }
.layer { position: sticky; height: 0; width: 0; overflow: visible; pointer-events: none; }
#lanesLayer { left: 0; z-index: 8; }
#stgLayer { top: 0; left: 0; z-index: 9; }
.stgrow { position: absolute; left: 0; top: 0; background: var(--sunken); border-bottom: 1px solid var(--line-2); }
.stgblk { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; border-left: 1px solid var(--line-2); padding: 0 12px; font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }


svg.edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; overflow: visible; }
.edge { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.edge--click { stroke: var(--accent); }
.edge--system { stroke: var(--sys); stroke-dasharray: 9 4 2 4; }
.edge--branch { stroke: var(--branch); stroke-dasharray: 6 5; }
.edge--back { stroke: var(--ink-3); stroke-dasharray: 2 5; }
.edge--join { stroke: var(--ink-3); stroke-width: 1.8; stroke-dasharray: 3 5; }
.edge.is-dim { opacity: .12; }
.edge.is-hot { stroke-width: 3.4; }
.mk--click { fill: var(--accent); } .mk--system { fill: var(--sys); } .mk--branch { fill: var(--branch); } .mk--back, .mk--join { fill: var(--ink-3); }
.elab { position: absolute; z-index: 4; transform: translate(-50%, -50%); max-width: 156px; padding: 3px 8px; border-radius: 8px; font-size: 12px; line-height: 1.25; text-align: center; background: var(--surface); border: 1px solid var(--branch); color: var(--branch); pointer-events: none; }
.elab--system { border-color: var(--sys); color: var(--sys); display: inline-flex; gap: 5px; align-items: center; }
.elab--system svg { flex: none; }
.elab--click { border-color: var(--accent); color: var(--accent); }
.elab--back, .elab--join { border-color: var(--ink-3); color: var(--ink-2); }
.elab.is-dim { opacity: .15; }

.node { position: absolute; z-index: 3; display: flex; flex-direction: column; gap: 6px; width: 176px; height: 172px; padding: 8px; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line-2); border-top: 4px solid var(--lc, var(--ink-3)); border-radius: 10px; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s, opacity .12s; }
.node:hover { transform: translateY(-2px); border-color: var(--lc); }
.node[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.node.is-dim { opacity: .2; }
.node__img { display: block; width: 160px; height: 100px; object-fit: cover; object-position: top left; border-radius: 5px; border: 1px solid var(--line); background: var(--sunken); }
.node__txt { font-size: 12.5px; line-height: 1.25; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node__txt b { color: var(--lc); font-weight: 600; }
.node__num { position: absolute; top: -13px; left: 8px; min-width: 24px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 11px; background: var(--lc); color: #fff; font: 700 12px/1 var(--font-display); }
:root[data-theme="dark"] .node__num { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node__num { color: #111; } }
.node__forks { position: absolute; bottom: -11px; right: 8px; height: 20px; padding: 0 8px; display: grid; place-items: center; border-radius: 10px; background: var(--branch-bg); color: var(--branch); border: 1px solid var(--branch); font: 600 11px/1 var(--font-ui); white-space: nowrap; }
.node__flag { position: absolute; top: -13px; right: 8px; height: 22px; padding: 0 7px; display: grid; place-items: center; border-radius: 11px; background: var(--branch-bg); color: var(--branch); border: 1px solid var(--branch); font: 600 11px/1 var(--font-ui); }
.node--sys { background: var(--sys-bg); border-style: dashed; border-color: var(--sys); border-top: 4px dashed var(--sys); border-radius: 22px 8px 22px 8px; }
.node--sys .node__img { border-radius: 14px 4px 14px 4px; }
.node--alarm { border-color: var(--alarm); background: var(--alarm-bg); }
.node--alarm .node__flag { background: var(--alarm); border-color: var(--alarm); color: #fff; }
:root[data-theme="dark"] .node--alarm .node__flag { color: #1a0a0d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node--alarm .node__flag { color: #1a0a0d; } }
.node__sysmark { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--sys); }

.panel { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); }
.panel[hidden] { display: none; }
.panel__head { position: sticky; top: 0; z-index: 3; display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.panel__head h2 { flex: 1; font-size: 18px; line-height: 1.25; }
.panel__head h2 small { display: block; margin-bottom: 4px; font: 600 12px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--lc, var(--ink-3)); }
.xbtn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; color: var(--ink); }
.xbtn:hover { border-color: var(--accent); }
.panel__body { padding: 14px 16px 22px; display: grid; gap: 16px; }
.shot { display: block; width: 100%; padding: 0; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--sunken); cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; }
.shot__cap { display: block; margin-top: 5px; font-size: 12.5px; color: var(--ink-3); }
.sec h3 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; font-weight: 600; }
.sec p { margin: 0 0 6px; color: var(--ink); }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); }
.sec .dlg { padding: 10px 12px; border-left: 4px solid var(--branch); background: var(--branch-bg); border-radius: 0 8px 8px 0; color: var(--ink); font-size: 14px; }
.sec .dlg b { display: block; margin-bottom: 2px; }
.sec .prep { color: var(--ink-2); font-size: 14px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--tint); color: var(--accent); }
.tag--sys { background: var(--sys-bg); color: var(--sys); }
.tag--branch { background: var(--branch-bg); color: var(--branch); }
.nav { display: grid; gap: 8px; }
.nav button { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; width: 100%; padding: 9px 12px; text-align: left; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); cursor: pointer; color: var(--ink); min-height: 44px; }
.nav button:hover { border-color: var(--accent); background: var(--tint); }
.nav button .k { font: 600 11.5px/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; padding-top: 3px; }
.nav button .k--click { color: var(--accent); } .nav button .k--system { color: var(--sys); } .nav button .k--branch { color: var(--branch); } .nav button .k--back, .nav button .k--join { color: var(--ink-3); }
.nav button small { grid-column: 2; font-size: 12.5px; color: var(--ink-3); }
.nav .lbl { font-size: 14px; }
.kbd { font-size: 12.5px; color: var(--ink-3); }

.lb { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(10,14,12,.86); }
.lb[hidden] { display: none; }
.lb img { max-width: 100%; max-height: calc(100vh - 40px); border-radius: 8px; background: #fff; }
.lb .xbtn { position: absolute; top: 14px; right: 14px; background: var(--surface); }

@media (max-width: 1100px) { .stage.has-panel { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 899px) {
  .panel { position: fixed; inset: 0; z-index: 60; max-height: none; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); }
  .ctl__lab { min-width: 100%; }
  .vp { height: clamp(380px, 70vh, 720px); }
}
@media (prefers-reduced-motion: reduce) { .node, .node:hover { transition: none; transform: none; } }
</style>

<div class="app" id="app">
  <header class="top">
    <h1>Пути медиапартнёров</h1>
    <p class="lead">Что нажимает каждая роль в программе медиапартнёров Housebook и что происходит после каждого нажатия. Нажмите на карточку: откроется экран, окно подтверждения и все развилки с этого места.</p>
    <div class="legend" id="legend" aria-label="Условные обозначения"></div>
  </header>
  <section class="ctl" aria-label="Фильтры карты">
    <div class="ctl__row"><span class="ctl__lab">Что показать</span>
      <div class="seg" role="group" aria-label="Режим карты" id="modeSeg"></div>
      <span class="ctl__lab" style="min-width:0;margin-left:10px">Масштаб</span>
      <div class="seg" role="group" aria-label="Масштаб карты"><button type="button" class="chip" id="zOut" aria-label="Уменьшить">Мельче</button><button type="button" class="chip" id="zIn" aria-label="Увеличить">Крупнее</button><button type="button" class="chip" id="zFit">Вписать</button></div>
    </div>
    <div class="ctl__row" id="forkRow"><span class="ctl__lab">Развилка</span></div>
    <div class="ctl__row" id="roleRow"><span class="ctl__lab">Только роль</span></div>
    <p class="hint" id="status" role="status" aria-live="polite"></p>
  </section>
  <main class="stage" id="stage">
    <div class="vp" id="vp" tabindex="0" aria-label="Карта путей, прокручивается в обе стороны"><div class="layer" id="lanesLayer" aria-hidden="true"></div><div class="layer" id="stgLayer" aria-hidden="true"></div><div class="sizer" id="sizer"><div class="canvas" id="canvas"></div></div></div>
    <aside class="panel" id="panel" hidden aria-label="Подробности шага"></aside>
  </main>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Снимок экрана во весь размер"><button type="button" class="xbtn" id="lbX" aria-label="Закрыть снимок"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><img id="lbImg" alt=""></div>

    '<span><svg width="54" height="14" viewBox="0 0 54 14" aria-hidden="true"><path d="M2 7h38" stroke="var(--branch)" stroke-width="2.2" stroke-dasharray="6 5"/><path d="M40 2.5l8 4.5-8 4.5z" fill="var(--branch)"/></svg>Развилка: пунктир с условием</span>' +
    '<span><svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect x="1" y="1" width="28" height="18" rx="4" fill="var(--surface)" stroke="var(--lane-fin)" stroke-width="2"/></svg>Карточка: шаг человека</span>' +
    '<span><svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><path d="M8 1h19a2 2 0 012 2v9a6 6 0 01-6 6H3a2 2 0 01-2-2V9a8 8 0 017-8z" fill="var(--sys-bg)" stroke="var(--sys)" stroke-width="1.8" stroke-dasharray="4 3"/></svg>Плашка с пунктиром: событие системы</span>' +
    '<span><svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><rect x="1" y="1" width="28" height="18" rx="4" fill="var(--alarm-bg)" stroke="var(--alarm)" stroke-width="2"/></svg>Красная рамка: тревога</span>' +
    '<span><svg width="54" height="14" viewBox="0 0 54 14" aria-hidden="true"><path d="M2 7h38" stroke="var(--ink-3)" stroke-width="1.8" stroke-dasharray="3 5"/><path d="M40 2.5l8 4.5-8 4.5z" fill="var(--ink-3)"/></svg>Серый пунктир: возврат на основной путь</span>' +
    '<span>Цвет полосы слева - роль. Кружок с числом - номер шага основного пути, с буквой - шаг развилки.</span>';

  /* ---------- фильтры ---------- */
  const modeSeg = $('#modeSeg');
  [['main', 'Основной путь'], ['all', 'Все развилки']].forEach(([v, t]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.mode = v; b.textContent = t; modeSeg.appendChild(b); });
  const forkRow = $('#forkRow'), roleRow = $('#roleRow');
  D.paths.filter(p => p.id !== 'main').forEach(p => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip chip--fork'; b.dataset.fork = p.id; b.innerHTML = '<i>' + esc(p.letter) + '</i>' + esc(p.short); b.title = p.cond; forkRow.appendChild(b); });
  [['', 'Все роли']].concat(D.lanes.map(l => [l.id, l.name])).forEach(([v, t]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.role = v; b.textContent = t; roleRow.appendChild(b); });

  /* ---------- раскладка ---------- */
  let LABW = 128;
  let L = null; // {pos, laneY, laneH, W, H, cols}
  function layout() {
    const vis = D.nodes.filter(n => S.mode === 'all' || isMain(n));
    const set = new Set(vis.map(n => n.id));
    const E = D.edges.filter(e => set.has(e.from) && set.has(e.to));
    const preds = {}; vis.forEach(n => { preds[n.id] = []; });
    E.forEach(e => { if (!e.back && !e.flat) preds[e.to].push(e.from); });
    const col = {}, busy = {};
    const visit = id => { if (id in col) return col[id]; if (busy[id]) return 0; busy[id] = 1; let c = 0; preds[id].forEach(p => { c = Math.max(c, visit(p) + 1); }); busy[id] = 0; return (col[id] = c); };
    vis.forEach(n => visit(n.id));
    const order = vis.slice().sort((a, b) => col[a.id] - col[b.id] || (isMain(b) - isMain(a)) || D.nodes.indexOf(a) - D.nodes.indexOf(b));
    const occ = {}, row = {};
    order.forEach(n => { const k = n.lane + '|' + col[n.id]; occ[k] = occ[k] || []; let r = 0; while (occ[k].indexOf(r) >= 0) r++; occ[k].push(r); row[n.id] = r; });
    const maxRow = {}; D.lanes.forEach(l => { maxRow[l.id] = -1; });
    vis.forEach(n => { maxRow[n.lane] = Math.max(maxRow[n.lane], row[n.id]); });
    const laneY = {}, laneH = {}; let y = TOPH;
    D.lanes.forEach(l => { const rows = maxRow[l.id] + 1; const h = rows ? LPAD * 2 + rows * RH - (RH - NH) : MINL; laneY[l.id] = y; laneH[l.id] = h; y += h; });
    const maxCol = Math.max.apply(null, vis.map(n => col[n.id]));
    const pos = {};
    vis.forEach(n => { pos[n.id] = { col: col[n.id], row: row[n.id], x: LW + PADX + col[n.id] * CW, y: laneY[n.lane] + LPAD + row[n.id] * RH, w: NW, h: NH }; });
    // границы этапов по основному пути
    const mainBy = st => vis.filter(n => isMain(n) && n.stage === st).map(n => col[n.id]);
    const lEnd = Math.max.apply(null, mainBy('launch')), cStart = Math.min.apply(null, mainBy('close'));
    const wEnd = Math.max.apply(null, mainBy('work').concat(vis.filter(n => !isMain(n) && col[n.id] > lEnd && col[n.id] < cStart).map(n => col[n.id])));
    const stages = [{ id: 'launch', name: 'Запуск', a: 0, b: lEnd }, { id: 'work', name: 'Работа', a: lEnd + 1, b: wEnd }, { id: 'close', name: 'Закрытие', a: wEnd + 1, b: Math.max(maxCol, wEnd + 1) }];
    L = { vis, set, E, pos, laneY, laneH, W: LW + PADX * 2 + (maxCol + 1) * CW, H: y + 10, stages, col };
  }

  /* ---------- рёбра ---------- */
  function bez(p0, p1, p2, p3, t) { const u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; }
  function route(e) {
    const a = L.pos[e.from], b = L.pos[e.to];
    let s, t, c1, c2;
    if (b.col > a.col) {
      s = [a.x + a.w, a.y + a.h / 2]; t = [b.x - 2, b.y + b.h / 2]; const dx = Math.max(34, (t[0] - s[0]) * 0.5); c1 = [s[0] + dx, s[1]]; c2 = [t[0] - dx, t[1]];
    } else if (b.col === a.col) {
      const down = b.y > a.y; s = [a.x + a.w / 2, down ? a.y + a.h : a.y]; t = [b.x + b.w / 2, down ? b.y - 2 : b.y + b.h + 2]; const dy = Math.max(30, Math.abs(t[1] - s[1]) * 0.45) * (down ? 1 : -1); c1 = [s[0], s[1] + dy]; c2 = [t[0], t[1] - dy];
    } else {
      s = [a.x + a.w / 2, a.y]; t = [b.x + b.w / 2, b.y - 2]; const lift = 70 + Math.abs(a.y - b.y) * 0.2; c1 = [s[0], s[1] - lift]; c2 = [t[0], t[1] - lift];
    }
    return { s, t, c1, c2, mid: bez(s, c1, c2, t, 0.5) };
  }

  function draw() {
    layout();
    const cv = $('#canvas'); cv.innerHTML = '';
    cv.style.width = L.W + 'px'; cv.style.height = L.H + 'px';
    // полосы
    D.lanes.forEach(l => {
      const band = document.createElement('div'); band.className = 'band'; band.dataset.lane = l.id;
      band.style.cssText = 'top:' + L.laneY[l.id] + 'px;height:' + L.laneH[l.id] + 'px;width:' + L.W + 'px;--lc:var(--lane-' + l.id + ')';
      band.innerHTML = (L.vis.some(n => n.lane === l.id) ? '' : '<div class="band__empty">' + esc(l.empty || '') + '</div>');
      cv.appendChild(band);
    });
    // этапы
    // рёбра
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'edges'); svg.setAttribute('width', L.W); svg.setAttribute('height', L.H); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = '<defs>' + ['click', 'system', 'branch', 'back', 'join'].map(k => '<marker id="mk-' + k + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="mk--' + k + '" d="M0 0L10 5L0 10z"/></marker>').join('') + '</defs>';
    cv.appendChild(svg);
    const labs = [];
    L.E.forEach(e => {
      const r = route(e), kind = e.back ? 'back' : e.join ? 'join' : e.type;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M' + r.s[0] + ' ' + r.s[1] + ' C' + r.c1[0] + ' ' + r.c1[1] + ' ' + r.c2[0] + ' ' + r.c2[1] + ' ' + r.t[0] + ' ' + r.t[1]);
      p.setAttribute('class', 'edge edge--' + kind); p.setAttribute('marker-end', 'url(#mk-' + kind + ')'); p.dataset.from = e.from; p.dataset.to = e.to;
      svg.appendChild(p); e._p = p;
      const text = e.label || '';
      if (text || e.type === 'system') {
        const d = document.createElement('div'); d.className = 'elab elab--' + kind; d.dataset.from = e.from; d.dataset.to = e.to;
        d.innerHTML = (e.type === 'system' && !e.back ? CLOCK : '') + (text ? '<span>' + esc(text) + '</span>' : '');
        let [mx, my] = r.mid; const w = Math.min(156, 16 + (text.length || 2) * 6.3), h = (e.type === 'system' && !text) ? 24 : 22 + Math.floor((text.length * 6.3) / 140) * 15;
        for (let k = 0; k < 8; k++) { const hit = labs.find(o => Math.abs(o.x - mx) < (o.w + w) / 2 && Math.abs(o.y - my) < (o.h + h) / 2); if (!hit) break; my += (k % 2 ? -1 : 1) * (h + 4) * (1 + (k >> 1)); }
        labs.push({ x: mx, y: my, w, h });
        d.style.left = mx + 'px'; d.style.top = my + 'px'; cv.appendChild(d); e._l = d;
      } else e._l = null;
    });
    // узлы
    L.vis.forEach(n => {
      const q = L.pos[n.id], b = document.createElement('button'); b.type = 'button';
      b.className = 'node' + (n.event || n.system ? ' node--sys' : '') + (n.alarm ? ' node--alarm' : ''); b.dataset.id = n.id;
      b.style.cssText = 'left:' + q.x + 'px;top:' + q.y + 'px;--lc:var(--lane-' + n.lane + ')';
      b.setAttribute('aria-label', (n.num ? 'Шаг ' + n.num + '. ' : '') + n.ariaLabel);
      b.innerHTML = '<span class="node__num" aria-hidden="true">' + esc(n.num) + '</span>' + (n.dialog ? '<span class="node__flag" aria-hidden="true">окно подтверждения</span>' : n.alarm ? '<span class="node__flag" aria-hidden="true">тревога</span>' : '') +
        (n.thumb ? '<img class="node__img" src="' + esc(n.thumb) + '" width="160" height="100" loading="lazy" alt="">' : '<div class="node__img"></div>') +
        '<span class="node__txt">' + (n.event || n.system ? '<span class="node__sysmark">' + CLOCK + 'система</span> ' : '<b>' + esc(n.roleShort) + ':</b> ') + esc(n.card) + '</span>';
      const fk = OUT[n.id].filter(e => e.type === 'branch' && !e.join && !e.back).map(e => NODE[e.to].paths[0]).filter((v, i, a) => v !== 'main' && a.indexOf(v) === i).map(v => PATH[v].letter);
      if (fk.length) b.insertAdjacentHTML('beforeend', '<span class="node__forks" aria-hidden="true">развилки: ' + fk.join(' ') + '</span>');
      b.addEventListener('click', () => select(n.id, true));
      cv.appendChild(b);
    });
    applyDim(); markSel(); fitOrZoom(); renderChrome();
  }


  /* ---------- подписи полос и этапов: вне масштабируемого полотна, чтобы липли к краям ---------- */
  function renderChrome() {
    if (!L) return;
    const z = S.zoom, ll = $('#lanesLayer'), sl = $('#stgLayer');
    LABW = innerWidth < 700 ? 84 : 128;
    $('#sizer').style.marginLeft = LABW + 'px';
    ll.classList.toggle('narrow', LABW < 100);
    ll.innerHTML = D.lanes.map(l => '<div class="lanelab" style="--lc:var(--lane-' + l.id + ');top:' + ((L.laneY[l.id]) * z) + 'px;height:' + (L.laneH[l.id] * z) + 'px;width:' + LABW + 'px"><b>' + esc(l.name) + '</b>' + (l.who ? '<small>' + esc(l.who) + '</small>' : '') + '</div>').join('');
    const bx = k => PADX + k * CW - (CW - NW) / 2;
    sl.innerHTML = '<div class="stgrow" style="width:' + (LABW + L.W * z) + 'px;height:' + (TOPH * z) + 'px">' + L.stages.map((s, i) => { const x0 = s.a ? bx(s.a) : 0, x1 = i === L.stages.length - 1 ? L.W : bx(s.b + 1); return '<div class="stgblk" style="left:' + (LABW + x0 * z) + 'px;width:' + ((x1 - x0) * z) + 'px">' + esc(s.name) + '</div>'; }).join('') + '</div>';
  }

  /* ---------- приглушение ---------- */
  function applyDim() {
    const bright = new Set(L.vis.map(n => n.id));
    if (S.fork) {
      const f = new Set(L.vis.filter(n => n.paths.indexOf(S.fork) >= 0).map(n => n.id));
      const B = new Set(f);
      L.E.forEach(e => { if (f.has(e.from) || f.has(e.to)) { B.add(e.from); B.add(e.to); } });
      bright.forEach(i => { if (!B.has(i)) bright.delete(i); });
    }
    if (S.role) bright.forEach(i => { if (NODE[i].lane !== S.role) bright.delete(i); });
    document.querySelectorAll('.node').forEach(el => el.classList.toggle('is-dim', !bright.has(el.dataset.id)));
    const fset = S.fork ? new Set(L.vis.filter(n => n.paths.indexOf(S.fork) >= 0).map(n => n.id)) : null;
    L.E.forEach(e => {
      const on = bright.has(e.from) && bright.has(e.to) && (!fset || fset.has(e.from) || fset.has(e.to));
      e._p.classList.toggle('is-dim', !on); if (e._l) e._l.classList.toggle('is-dim', !on);
    });
    const vc = L.vis.length, fc = S.fork ? [...fset].length : 0;
    $('#status').textContent = S.fork ? 'Развилка «' + PATH[S.fork].letter + '. ' + PATH[S.fork].name + '»: ' + PATH[S.fork].cond + '. Шагов в развилке: ' + fc + '. Остальное приглушено.' : S.role ? 'Видны только шаги роли «' + LANE[S.role].name + '», остальное приглушено.' : S.mode === 'main' ? 'Основной путь: ' + vc + ' шагов от допуска партнёра до возврата остатка.' : 'Все пути: ' + vc + ' шагов и ' + L.E.length + ' переходов, из них развилок ' + (D.paths.length - 1) + '.';
  }
  function markSel() {
    document.querySelectorAll('.node').forEach(el => { if (el.dataset.id === S.sel) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
    L.E.forEach(e => e._p.classList.toggle('is-hot', !!S.sel && (e.from === S.sel || e.to === S.sel)));
  }

  /* ---------- масштаб ---------- */
  function setZoom(z) {
    S.zoom = Math.max(0.35, Math.min(1.4, z));
    $('#canvas').style.transform = 'scale(' + S.zoom + ')';
    const sz = $('#sizer'); sz.style.width = L.W * S.zoom + 'px'; sz.style.height = L.H * S.zoom + 'px';
    renderChrome();
  }
  function fitOrZoom() { if (S.fit) { const w = $('#vp').clientWidth - LABW - 4; setZoom(Math.min(1, Math.max(0.35, w / L.W))); if (L.W * 0.35 > w) setZoom(0.35); } else setZoom(S.zoom); }

  /* ---------- панель ---------- */
  const rn = n => D.rolesFull[n.role] || n.role;
  function nextOf(n) { const o = OUT[n.id]; return o.find(e => !e.back && !e.flat && NODE[e.to].paths[0] === n.paths[0] && e.type !== 'branch') || o.find(e => e.type !== 'branch' && !e.back) || o[0] || null; }
  function prevOf(n) { const i = INC[n.id]; return i.find(e => NODE[e.from].paths[0] === n.paths[0] && !e.back) || i.find(e => !e.back) || i[0] || null; }
  const kind = e => (e.back ? 'back' : e.join ? 'join' : e.type);
  const kname = { click: 'нажатие', system: 'событие', branch: 'развилка', back: 'возврат', join: 'возврат' };
  function navBtn(e, to) {
    const t = NODE[to], lab = e.label ? esc(e.label) : (e.type === 'click' ? 'дальше' : '');
    return '<button type="button" data-go="' + to + '"><span class="k k--' + kind(e) + '">' + kname[kind(e)] + '</span><span class="lbl">' + (lab ? lab + ': ' : '') + '<b>' + esc((t.num ? t.num + '. ' : '') + t.roleShort + ' - ' + t.card) + '</b></span></button>';
  }
  function select(id, scroll) {
    S.sel = id; const n = NODE[id];
    if (S.mode === 'main' && !isMain(n)) { S.mode = 'all'; syncCtl(); draw(); }
    const p = $('#panel'); p.hidden = false; $('#stage').classList.add('has-panel');
    const lane = LANE[n.lane];
    const out = OUT[id], inc = INC[id];
    let h = '<div class="panel__head" style="--lc:var(--lane-' + n.lane + ')"><h2 id="ph" tabindex="-1"><small>' + esc(n.paths[0] === 'main' ? 'Основной путь, шаг ' + n.num : 'Развилка ' + n.num + ': ' + (PATH[n.paths[0]] ? PATH[n.paths[0]].name : '')) + '</small>' + esc(n.roleFull) + ': ' + esc(n.card) + '</h2><button type="button" class="xbtn" id="pClose" aria-label="Закрыть панель"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><div class="panel__body">';
    if (n.shot) h += '<div><button type="button" class="shot" data-lb="' + esc(n.shot) + '" aria-label="Открыть снимок во весь экран"><img src="' + esc(n.shot) + '" alt="Экран шага: ' + esc(n.ariaLabel) + '"></button><span class="shot__cap">' + (n.event || n.system ? 'Экран в момент события' : n.noBtn ? 'Экран роли: задача без кнопки' : 'Оранжевая рамка - кнопка, которую нажимают') + '. Нажмите на снимок, чтобы открыть крупно.</span></div>';
    else h += '<p class="sec"><span class="tag tag--branch">снимка нет</span> ' + esc(n.noShotWhy || 'Шаг не воспроизвёлся в макете.') + '</p>';
    if (n.dialogShot) h += '<div><button type="button" class="shot" data-lb="' + esc(n.dialogShot) + '" aria-label="Открыть окно подтверждения во весь экран"><img src="' + esc(n.dialogShot) + '" alt="Окно подтверждения"></button><span class="shot__cap">Окно подтверждения: нажимают оранжевую кнопку.</span></div>';
    if (n.afterShot) h += '<div><button type="button" class="shot" data-lb="' + esc(n.afterShot) + '" aria-label="Открыть снимок после нажатия"><img src="' + esc(n.afterShot) + '" alt="' + esc(n.afterShotAlt || 'Экран после нажатия') + '"></button><span class="shot__cap">' + esc(n.afterShotCap || 'Экран после нажатия') + '</span></div>';
    const inE = inc.find(e => e.type === 'branch' && !e.back);
    if (inE && inE.label) h += '<div class="sec"><h3>Условие развилки</h3><p><span class="tag tag--branch">развилка</span> ' + esc(inE.label) + '</p></div>';
    h += '<div class="sec"><h3>Кто</h3><p>' + esc(n.roleFull) + (n.person ? ' (' + esc(n.person) + ')' : '') + (n.event || n.system ? ' <span class="tag tag--sys">автоматика</span>' : '') + '</p></div>';
    h += '<div class="sec"><h3>' + (n.event || n.system ? 'Что случается' : n.noBtn ? 'Кнопки нет' : 'Что нажимает') + '</h3><p>' + (n.event || n.system || n.noBtn ? esc(n.press) : '«' + esc(n.press) + '»') + '</p>' + (n.prep ? '<p class="prep">' + esc(n.prep) + '</p>' : '') + '</div>';
    if (n.dialog) h += '<div class="sec"><h3>Окно подтверждения</h3><div class="dlg"><b>' + esc(n.dialog.title) + '</b>' + esc(n.dialog.text) + (n.dialog.reasonNote ? '<br><i>' + esc(n.dialog.reasonNote) + '</i>' : '') + '<br>Подтверждающая кнопка: «' + esc(n.dialog.ok) + '»</div></div>';
    h += '<div class="sec"><h3>' + (n.noBtn ? 'Что делает роль' : 'Что происходит после нажатия') + '</h3><p>' + esc(n.result) + '</p>' + (n.bullets && n.bullets.length ? '<ul>' + n.bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' : '') + '</div>';
    h += '<div class="sec"><h3>Кому приходит задача или уведомление</h3>' + (n.notify && n.notify.length ? '<ul>' + n.notify.map(b => '<li><b>' + esc(b.who) + ':</b> ' + esc(b.text) + '</li>').join('') + '</ul>' : '<p>Новых задач никому не приходит.</p>') + '</div>';
    h += '<div class="sec"><h3>Дальше</h3>' + (out.length ? '<div class="nav">' + out.map(e => navBtn(e, e.to)).join('') + '</div>' : '<p>' + (n.noBtn || /необязательно|на ход не влияет|путь не двигает/.test(n.result || '') ? 'Побочная карточка: на ход пути не влияет, путь идёт по другим карточкам.' : 'Это конец пути.') + '</p>') + '</div>';
    h += '<div class="sec"><h3>Откуда пришли</h3>' + (inc.length ? '<div class="nav">' + inc.map(e => navBtn(e, e.from)).join('') + '</div>' : '<p>Это начало пути.</p>') + '</div>';
    h += '<p class="kbd">Клавиши: стрелки вправо и влево - следующий и предыдущий шаг этого пути, Esc - закрыть.</p></div>';
    p.innerHTML = h;
    p.style.setProperty('--lc', 'var(--lane-' + n.lane + ')');
    p.scrollTop = 0;
    markSel();
    if (scroll) { const el = document.querySelector('.node[data-id="' + id + '"]'); if (el) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduced ? 'auto' : 'smooth' }); }
    if (!(matchMedia('(min-width: 900px)').matches)) { document.documentElement.style.overflow = 'hidden'; }
    const ph = $('#ph'); if (ph && !scroll) ph.focus({ preventScroll: true }); else if (ph) ph.focus({ preventScroll: true });
  }
  function closePanel() {
    $('#panel').hidden = true; $('#stage').classList.remove('has-panel'); document.documentElement.style.overflow = '';
    const id = S.sel; S.sel = null; markSel(); fitOrZoom();
    const el = id && document.querySelector('.node[data-id="' + id + '"]'); if (el) el.focus({ preventScroll: true });
  }
  $('#panel').addEventListener('click', ev => {
    const g = ev.target.closest('[data-go]'); if (g) { select(g.dataset.go, true); return; }
    const lb = ev.target.closest('[data-lb]'); if (lb) { $('#lbImg').src = lb.dataset.lb; $('#lb').hidden = false; $('#lbX').focus(); return; }
    if (ev.target.closest('#pClose')) closePanel();
  });
  $('#lb').addEventListener('click', ev => { if (ev.target.id === 'lb' || ev.target.closest('#lbX')) { $('#lb').hidden = true; } });

  /* ---------- управление ---------- */
  function syncCtl() {
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
    document.querySelectorAll('[data-fork]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fork === S.fork)));
    document.querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.role || null) === S.role || (!b.dataset.role && !S.role))));
  }
  document.querySelector('.ctl').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.mode) { S.mode = b.dataset.mode; if (S.mode === 'main') S.fork = null; syncCtl(); draw(); if (S.sel && !L.set.has(S.sel)) closePanel(); return; }
    if (b.dataset.fork !== undefined) { S.fork = S.fork === b.dataset.fork ? null : b.dataset.fork; if (S.fork) S.mode = 'all'; syncCtl(); draw(); if (S.fork) { const f = D.nodes.find(n => n.paths.indexOf(S.fork) >= 0); const el = f && document.querySelector('.node[data-id="' + f.id + '"]'); if (el) el.scrollIntoView({ block: 'center', inline: 'center', behavior: reduced ? 'auto' : 'smooth' }); } return; }
    if (b.dataset.role !== undefined) { S.role = b.dataset.role || null; syncCtl(); applyDim(); return; }
    if (b.id === 'zIn') { S.fit = false; setZoom(S.zoom + 0.15); } else if (b.id === 'zOut') { S.fit = false; setZoom(S.zoom - 0.15); } else if (b.id === 'zFit') { S.fit = true; fitOrZoom(); }
  });
  addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (!$('#lb').hidden) { $('#lb').hidden = true; ev.preventDefault(); return; } if (!$('#panel').hidden) { closePanel(); ev.preventDefault(); } return; }
    if (!S.sel || !$('#lb').hidden) return;
    const t = ev.target; if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') { const e = nextOf(NODE[S.sel]); if (e) { select(e.to, true); ev.preventDefault(); } }
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') { const e = prevOf(NODE[S.sel]); if (e) { select(e.from, true); ev.preventDefault(); } }
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.fit) fitOrZoom(); }, 120); });

  syncCtl(); draw();
  const first = new URLSearchParams(location.search).get('n'); if (first && NODE[first]) select(first, true);
  window.__karta = { select, S, NODE, draw };
})();
</script>
