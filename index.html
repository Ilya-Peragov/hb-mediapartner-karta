<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Медиапартнёры Housebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#f6f8f6;--card:#fff;--ink:#14231a;--mute:#566159;--line:#dbe3dd;--brand:#1f7a4d;--brand-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1712;--card:#17211a;--ink:#e8f0ea;--mute:#9aa89f;--line:#2a372e;--brand:#3fb77c;--brand-ink:#0b140e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{width:100%;max-width:560px}
h1{font:600 clamp(24px,6vw,34px)/1.2 "Geologica","IBM Plex Sans",sans-serif;margin:0 0 12px}
p{margin:0 0 24px;color:var(--mute)}
.links{display:grid;gap:12px}
a{display:block;padding:16px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;transition:border-color .15s,transform .15s}
a:first-child{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
a:hover,a:focus-visible{border-color:var(--brand);transform:translateY(-1px)}
a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Медиапартнёры Housebook: макет и карта путей</h1>
<p>Две демонстрационные страницы для просмотра.</p>
<div class="links">
<a href="maket/">Макет кабинетов</a>
<a href="karta/">Карта путей</a>
</div>
</main>
</body>
</html>
