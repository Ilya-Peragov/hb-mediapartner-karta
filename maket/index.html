<script>
/* только макет: тема. Опубликованный артефакт получает от хоста data-theme="dark" у тёмного зрителя, а кит держит «Сумерки» и по html.dusk, и по этому атрибуту.
   Поэтому выбор зрителя (по умолчанию светлая) ставит оба признака сразу, помнится в localStorage и применяется до первой отрисовки; атрибут, который хост перезапишет позже, возвращается к выбору. */
(() => {
  const root = document.documentElement, KEY = 'mk-theme';
  let theme = 'light';
  try { if (localStorage.getItem(KEY) === 'dark') theme = 'dark'; } catch (e) {}
  const apply = () => { if (root.dataset.theme !== theme) root.dataset.theme = theme; root.classList.toggle('dusk', theme === 'dark'); };
  new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  apply();
  window.mkTheme = { get: () => theme, set: t => { theme = t === 'dark' ? 'dark' : 'light'; try { localStorage.setItem(KEY, theme); } catch (e) {} apply(); document.dispatchEvent(new CustomEvent('hb:theme', { detail: { night: theme === 'dark' } })); } };
})();
</script>
